<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Latest headlines from news portals around the world." />
        <meta name="color-scheme" content="dark" />
        <title>News Portal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="header">
            <p class="header__eyebrow">Live headlines</p>
            <h1 class="header__title">News Portal</h1>
            <p class="header__lead">Pick a newsroom and read what it is publishing right now.</p>
        </header>
        <main>
            <div class="sources">
                <label class="sources__label" id="sourcesLabel" for="sourcesToggle">News source</label>
                <button
                    id="sourcesToggle"
                    class="sources__toggle"
                    type="button"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="sourcesList"
                    disabled
                >
                    <span class="sources__toggle-text">Loading sources&hellip;</span>
                    <svg class="sources__toggle-arrow" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path
                            d="M3 6l5 5 5-5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>
                <div class="sources__dropdown">
                    <div class="sources__search-wrap">
                        <input
                            class="sources__search"
                            type="search"
                            role="combobox"
                            aria-expanded="true"
                            aria-controls="sourcesList"
                            placeholder="Search sources&hellip;"
                            aria-label="Search news sources"
                            autocomplete="off"
                        />
                    </div>
                    <ul id="sourcesList" class="sources__list" role="listbox" aria-labelledby="sourcesLabel"></ul>
                </div>
            </div>
            <div class="news" aria-live="polite"></div>
        </main>
        <footer class="footer">
            <a class="footer__github" href="https://github.com/presetslrdev" target="_blank" rel="noopener noreferrer">
                presetslrdev
            </a>
            <p class="copyright">
                2026 &middot; Data by
                <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
            </p>
            <a
                class="footer__logo"
                href="https://rs.school/courses/javascript"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" height="36" />
            </a>
        </footer>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo" role="presentation"></div>
                </div>
                <div class="news__description">
                    <p class="news__description-source"></p>
                    <h2 class="news__description-title"></h2>
                    <p class="news__description-content"></p>
                    <div class="news__footer">
                        <p class="news__byline">
                            <span class="news__meta-author"></span>
                            <time class="news__meta-date"></time>
                        </p>
                        <a class="news__read-more" href="#" target="_blank" rel="noopener noreferrer">
                            Read more <span aria-hidden="true">&rarr;</span>
                        </a>
                    </div>
                </div>
            </article>
        </template>
    </body>
</html>
